name: Check prices

on:
  schedule:
    # 9:00 AM AEST (UTC+10) = 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser + system deps
        run: playwright install --with-deps chromium

      - name: Run price check
        env:
          SMTP_USER:    ${{ secrets.SMTP_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/check_prices.py

      - name: Commit updated prices
        run: |
          git config user.name  "noice-proice[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet \
            && echo "No price changes." \
            || git commit -m "chore: prices $(date -u '+%Y-%m-%d')"
          git push
