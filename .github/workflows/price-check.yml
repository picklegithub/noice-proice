name: Check prices

on:
  schedule:
    # 9:00 AM AEST (UTC+10) = 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:        # manual trigger from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to commit data/prices.json back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run price check
        env:
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASS:     ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL:  ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/check_prices.py

      - name: Commit updated prices
        run: |
          git config user.name  "noice-proice[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          # Only commit if the file actually changed
          git diff --staged --quiet \
            && echo "No price changes today, nothing to commit." \
            || git commit -m "chore: prices $(date -u '+%Y-%m-%d')"
          git push
