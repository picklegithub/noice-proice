<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noice-proice</title>
<style>
  :root {
    --bg:       #f5f5f5;
    --surface:  #ffffff;
    --border:   #e5e7eb;
    --text:     #111827;
    --muted:    #6b7280;
    --accent:   #4f46e5;
    --green:    #16a34a;
    --green-bg: #f0fdf4;
    --green-bd: #bbf7d0;
    --red:      #dc2626;
    --amber:    #d97706;
    --radius:   12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --text:     #f1f5f9;
      --muted:    #94a3b8;
      --accent:   #818cf8;
      --green:    #4ade80;
      --green-bg: #052e16;
      --green-bd: #166534;
      --red:      #f87171;
      --amber:    #fbbf24;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  header {
    max-width: 900px;
    margin: 0 auto 28px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .last-run {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
  .stats {
    max-width: 900px;
    margin: 0 auto 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-val   { font-size: 22px; font-weight: 600; }
  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: box-shadow .15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .card.target-hit {
    border-color: var(--green-bd);
    background: linear-gradient(var(--surface) 0%, var(--green-bg) 100%);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .card-name a { color: inherit; text-decoration: none; }
  .card-name a:hover { color: var(--accent); }
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 99px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-green  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
  .badge-muted  { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .badge-err    { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
  @media (prefers-color-scheme: dark) {
    .badge-err  { background: #1c0408; color: #f87171; border-color: #450a0a; }
  }
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .price-current {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .price-current.green { color: var(--green); }
  .trend {
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .trend.down { color: var(--green); }
  .trend.up   { color: var(--red); }
  .trend.flat { color: var(--muted); }
  .target-line {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .target-line .hit { color: var(--green); font-weight: 600; }
  .sparkline-wrap { height: 36px; }
  sparkline-wrap svg { display: block; }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }
  .loading {
    text-align: center;
    padding: 80px 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .error-state {
    text-align: center;
    padding: 60px 16px;
    color: var(--muted);
    max-width: 420px;
    margin: 0 auto;
  }
  .error-state h2 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
  .error-state p  { font-size: 13px; line-height: 1.6; }
  .sort-bar {
    max-width: 900px;
    margin: 0 auto 16px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .sort-btn {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  .sort-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .notes { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">noice<span>-</span>proice</div>
  <div class="last-run" id="last-run">loading…</div>
</header>

<div class="stats" id="stats" hidden>
  <div class="stat"><div class="stat-label">Watching</div><div class="stat-val" id="s-total">—</div></div>
  <div class="stat"><div class="stat-label">Below target</div><div class="stat-val" id="s-target" style="color:var(--green)">—</div></div>
  <div class="stat"><div class="stat-label">Dropped today</div><div class="stat-val" id="s-drops" style="color:var(--accent)">—</div></div>
  <div class="stat"><div class="stat-label">Errors</div><div class="stat-val" id="s-errors" style="color:var(--amber)">—</div></div>
</div>

<div class="sort-bar" id="sort-bar" hidden>
  <span style="font-size:12px;color:var(--muted);">Sort:</span>
  <button class="sort-btn active" data-sort="name">A → Z</button>
  <button class="sort-btn" data-sort="price-low">Price ↑</button>
  <button class="sort-btn" data-sort="price-high">Price ↓</button>
  <button class="sort-btn" data-sort="target">Targets first</button>
  <button class="sort-btn" data-sort="drop">Biggest drop</button>
</div>

<main id="main">
  <div class="loading">Loading prices…</div>
</main>

<script>
// ── sparkline ─────────────────────────────────────────────────────────────────
function sparkline(history, hit) {
  if (!history || history.length < 2) return '';
  const prices = history.map(h => h.price);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const range = max - min || 1;
  const W = 120, H = 32, pad = 3;
  const pts = prices.map((p, i) => {
    const x = pad + (i / (prices.length - 1)) * (W - pad * 2);
    const y = H - pad - ((p - min) / range) * (H - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const color = hit ? '#16a34a' : '#6366f1';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="2.5" fill="${color}"/>
  </svg>`;
}

// ── relative time ─────────────────────────────────────────────────────────────
function relTime(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const h = diff / 3_600_000;
  if (h < 1)  return `${Math.round(h * 60)}m ago`;
  if (h < 24) return `${Math.round(h)}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

function fmt(n) {
  if (n == null) return '—';
  return '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── card render ───────────────────────────────────────────────────────────────
function renderCard(id, item) {
  const price   = item.currentPrice;
  const prev    = item.previousPrice;
  const target  = item.targetPrice;
  const hit     = price != null && target != null && price <= target;
  const history = item.history || [];

  const trend = (() => {
    if (!price || !prev) return { cls: 'flat', arrow: '–', txt: '' };
    const pct = ((price - prev) / prev * 100).toFixed(1);
    if (price < prev) return { cls: 'down', arrow: '↓', txt: `${Math.abs(pct)}%` };
    if (price > prev) return { cls: 'up',   arrow: '↑', txt: `${pct}%` };
    return { cls: 'flat', arrow: '–', txt: '' };
  })();

  const badgeHtml = item.lastError
    ? `<span class="badge badge-err">error</span>`
    : hit
      ? `<span class="badge badge-green">below target</span>`
      : `<span class="badge badge-muted">${item.source || 'unchecked'}</span>`;

  const targetHtml = target
    ? `<div class="target-line">
        Target ${fmt(target)}
        ${hit ? '<span class="hit">✓ hit</span>' : `· ${fmt(price && target ? price - target : null)} away`}
       </div>`
    : '';

  return `
  <div class="card${hit ? ' target-hit' : ''}" id="card-${id}">
    <div class="card-top">
      <div class="card-name"><a href="${item.url}" target="_blank" rel="noopener">${item.name}</a></div>
      ${badgeHtml}
    </div>
    <div class="price-row">
      <div class="price-current${hit ? ' green' : ''}">${fmt(price)}</div>
      <div class="trend ${trend.cls}">${trend.arrow} ${trend.txt}</div>
    </div>
    ${targetHtml}
    <div class="sparkline-wrap">${sparkline(history, hit)}</div>
    ${item.notes ? `<div class="notes">${item.notes}</div>` : ''}
    <div class="meta">
      <span>${item.source ? item.source.replace('shopify_api','shopify').replace('json_ld','JSON-LD').replace(/^css:.*/,'DOM') : '—'}</span>
      <span>${relTime(item.lastChecked)}</span>
    </div>
  </div>`;
}

// ── sort ──────────────────────────────────────────────────────────────────────
let currentSort = 'name';
let allItems = [];

function sortItems(items, mode) {
  const arr = [...items];
  if (mode === 'price-low')  arr.sort((a,b) => (a[1].currentPrice??Infinity) - (b[1].currentPrice??Infinity));
  if (mode === 'price-high') arr.sort((a,b) => (b[1].currentPrice??-1) - (a[1].currentPrice??-1));
  if (mode === 'name')       arr.sort((a,b) => a[1].name.localeCompare(b[1].name));
  if (mode === 'target')     arr.sort((a,b) => {
    const ha = a[1].currentPrice != null && a[1].targetPrice != null && a[1].currentPrice <= a[1].targetPrice;
    const hb = b[1].currentPrice != null && b[1].targetPrice != null && b[1].currentPrice <= b[1].targetPrice;
    return hb - ha;
  });
  if (mode === 'drop')       arr.sort((a,b) => {
    const da = a[1].previousPrice ? (a[1].previousPrice - a[1].currentPrice) / a[1].previousPrice : 0;
    const db = b[1].previousPrice ? (b[1].previousPrice - b[1].currentPrice) / b[1].previousPrice : 0;
    return db - da;
  });
  return arr;
}

function renderGrid() {
  const sorted = sortItems(allItems, currentSort);
  document.getElementById('main').innerHTML =
    `<div class="grid">${sorted.map(([id, item]) => renderCard(id, item)).join('')}</div>`;
}

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    renderGrid();
  });
});

// ── load data ─────────────────────────────────────────────────────────────────
async function load() {
  try {
    const r = await fetch('data/prices.json?t=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();

    allItems = Object.entries(data);

    if (allItems.length === 0) {
      document.getElementById('main').innerHTML = `
        <div class="error-state">
          <h2>No data yet</h2>
          <p>The first price check hasn't run yet. Trigger the GitHub Action manually or wait for tomorrow's scheduled run.</p>
        </div>`;
      return;
    }

    // Stats
    const prices   = allItems.map(([,v]) => v.currentPrice).filter(Boolean);
    const hits     = allItems.filter(([,v]) => v.currentPrice != null && v.targetPrice != null && v.currentPrice <= v.targetPrice);
    const drops    = allItems.filter(([,v]) => v.previousPrice && v.currentPrice < v.previousPrice);
    const errors   = allItems.filter(([,v]) => v.lastError);

    document.getElementById('s-total').textContent  = allItems.length;
    document.getElementById('s-target').textContent = hits.length;
    document.getElementById('s-drops').textContent  = drops.length;
    document.getElementById('s-errors').textContent = errors.length;

    // Most recent check time
    const times = allItems.map(([,v]) => v.lastChecked).filter(Boolean).sort().reverse();
    if (times[0]) {
      const d = new Date(times[0]);
      document.getElementById('last-run').textContent =
        `Last checked ${d.toLocaleString('en-AU', { dateStyle:'medium', timeStyle:'short' })} AEST`;
    }

    document.getElementById('stats').hidden    = false;
    document.getElementById('sort-bar').hidden = false;

    renderGrid();

  } catch (err) {
    document.getElementById('main').innerHTML = `
      <div class="error-state">
        <h2>Could not load price data</h2>
        <p>Make sure <code>data/prices.json</code> exists in the repo and GitHub Pages is serving from the correct branch.<br><br>Error: ${err.message}</p>
      </div>`;
  }
}

load();
</script>
</body>
</html>
